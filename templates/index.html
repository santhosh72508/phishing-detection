<!DOCTYPE html>
<html>
<head>
    <title>Phishing Website Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding-top: 80px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #222;
        }

        input {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Phishing Website Detection</h1>

    <p>Enter a website URL to check whether it is phishing.</p>

    <form action="/predict" method="POST">

        <input
            type="text"
            name="url"
            placeholder="https://example.com"
            required
        >

        <br>

        <button type="submit">
            Check Website
        </button>

    </form>

    {% if result %}

        <div class="result">
            {{ result }}
        </div>

        <div class="message">
            {{ message }}
        </div>

    {% endif %}

</div>

</body>
</html>
